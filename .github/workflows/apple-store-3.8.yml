name: Apple Store 4.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout customization
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: customization
          persist-credentials: false
      - name: Checkout tested base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: claration/Feather
          ref: 7078b053c0af262809a48e4d3898d42b0d35fedf
          submodules: recursive
          path: source
          persist-credentials: false
      - name: Build and verify Apple Store 4.5
        shell: bash
        run: bash customization/apple-store/build.sh
      - name: Apple Store IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Apple-Store-4.5-IPA
          path: |
            source/packages/Apple Store.ipa
            source/packages/release.json
          if-no-files-found: error
          retention-days: 14
      - name: Source and licenses for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Apple-Store-4.5-Source-and-Licenses
          path: |
            Apple-Store-4.5-Source.zip
            Apple-Store-4.5-Licenses.zip
          if-no-files-found: error
          retention-days: 14
      - name: Build report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Apple-Store-4.5-Report
          path: source/build-report/
          if-no-files-found: ignore
          retention-days: 14
